# P6 v4 — approx MOPD · P1 teacher + P1 warm-start student · pos-only OPD
# Recipe R · H=4 · no λ / no Effort
# Topology: 3-node · 24×Hopper (96GB HBM) · vllm:d4 + fsdp:d20 · batch=160
# v1: α=0.05 no /T → reward collapse. v2: len-norm+α=0.5 disk → NFS 120s. v3: xccl OK, boxed −6.25pp.
# v4: student/ref=P1 final; K3_MOPD_POS_ONLY=1 (drop negative log-ratio); keep xccl+len-norm α=0.5.
# Claim: approx MOPD (one teacher). ≠ nine-expert K3 MOPD.

experiment_name: k3-align-math-rl
trial_name: p6-mopd-p1teacher-24gpu-v4

seed: 1
enable_offload: false
total_train_epochs: 50
total_train_steps: 200
tokenizer_path: ${actor.path}

cluster:
  n_nodes: 3
  n_gpus_per_node: 8
  fileroot: ${oc.env:K3_ROOT}/experiments
  name_resolve:
    type: nfs
    nfs_record_root: ${oc.env:K3_ROOT}/tmp/name_resolve/${experiment_name}/${trial_name}

scheduler:
  type: ray

rollout:
  backend: "vllm:d4p1t1"
  admin_api_key: k3-align-p6-mopd-p1teacher-24gpu-v4-20260812
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 32
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 4
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: false
  agent:
    mode: inline
    admin_api_key: k3-align-p6-mopd-p1teacher-24gpu-v4-20260812
    export_style: individual
    turn_discount: 1.0

gconfig:
  n_samples: 8
  min_new_tokens: 0
  max_new_tokens: 512
  max_tokens: 1024
  greedy: false
  temperature: 1.0

actor:
  backend: "fsdp:d20p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${oc.env:P1_CKPT}
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  attn_impl: sdpa
  mb_spec:
    max_tokens_per_mb: 16384
  optimizer:
    type: adam
    lr: 1.0e-6
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.0
  eps_clip: 0.2
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    level: token
    action: mask
    metric: ratio
    lower: 0.2
    upper: 5.0
  reward_norm:
    mean_level: group
    std_level: null
    group_size: ${gconfig.n_samples}
  adv_norm:
    mean_level: null
    std_level: null
  weight_update_mode: xccl
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 8
      cmd: python3 -c "import k25_boot; import p6_boot; import runpy; runpy.run_module('areal.infra.rpc.rpc_server', run_name='__main__')"
      env_vars:
        PYTHONPATH: "${oc.env:K3_ROOT}/pythonpath:${oc.env:SITE}:${oc.env:AREAL_REPO}"
        PATH: "${oc.env:VENV}/bin:/usr/local/bin:/usr/bin"
        K25_TAU_LOG_RATIO_SQ: "0.01"
        K3_MOPD_ENABLED: "1"
        K3_MOPD_RMAX: "2.0"
        K3_MOPD_ALPHA: "0.5"
        K3_MOPD_LEN_NORM: "1"
        K3_MOPD_ADV_CLIP: "2.0"
        K3_MOPD_POS_ONLY: "1"
        K3_MOPD_AUDIT_EVERY: "8"
        K3_MOPD_AUDIT_PATH: "${oc.env:K3_ROOT}/experiments/checkpoints/root/k3-align-math-rl/p6-mopd-p1teacher-24gpu-v4/mopd_audit.jsonl"
        NCCL_SOCKET_IFNAME: eth0
        GLOO_SOCKET_IFNAME: eth0
        TP_SOCKET_IFNAME: eth0
        NCCL_IB_DISABLE: "1"
        NCCL_NET: Socket
        SWANLAB_MODE: disabled
        WANDB_MODE: disabled

# Approx MOPD teacher = P1 sync final (highest boxed expert). Colocate on actor GPUs.
teacher:
  engine_type: train
  path: ${oc.env:P1_CKPT}
  offload: false
  rl_loss_weight: 1.0
  distill_loss_weight: 0.0
  train:
    backend: ${actor.backend}
    experiment_name: ${experiment_name}
    trial_name: ${trial_name}
    path: ${oc.env:P1_CKPT}
    init_from_scratch: false
    disable_dropout: true
    dtype: ${actor.dtype}
    attn_impl: sdpa
    mb_spec:
      max_tokens_per_mb: 16384
    optimizer: null
    scheduling_strategy:
      type: colocation
      target: actor
    scheduling_spec: ${actor.scheduling_spec}

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${oc.env:P1_CKPT}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  attn_impl: sdpa
  mb_spec:
    max_tokens_per_mb: 16384
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 1024
  max_num_seqs: 64
  gpu_memory_utilization: 0.55

train_dataset:
  batch_size: 160
  shuffle: true
  drop_last: true
  pin_memory: false
  num_workers: 4
  path: ${oc.env:DATA_PATH}
  type: rl
  max_length: 512
  scheduling_spec: null

valid_dataset: null

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 200
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
  swanlab:
    mode: disabled
  trackio:
    mode: disabled

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false

reward:
  backend: local
  timeout_seconds: 60
  max_retries: 0
  on_error: zero
